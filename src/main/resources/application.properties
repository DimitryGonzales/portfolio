spring.application.name=portfolio

# Cache
spring.cache.cache-names=repos
spring.cache.caffeine.spec=expireAfterWrite=1h

# Enable livereload
spring.thymeleaf.cache=false

spring.devtools.livereload.enabled=true
spring.devtools.restart.enabled=true

spring.devtools.restart.additional-paths=src/main/resources/templates,src/main/resources/static

# Github variables
github.username=DimitryGonzales
github.max-projects=6

# Spring Mail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.contact.to=${MAIL_USERNAME}

app.contact.max-per-window=1
app.contact.window-minutes=60

server.forward-headers-strategy=native
