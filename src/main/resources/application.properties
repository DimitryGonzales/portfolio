spring.application.name=portfolio

# Cache
spring.cache.cache-names=repos
spring.cache.caffeine.spec=expireAfterWrite=1h

# Enable livereload
spring.thymeleaf.cache=false

spring.devtools.livereload.enabled=true
spring.devtools.restart.enabled=true

spring.devtools.restart.additional-paths=src/main/resources/templates,src/main/resources/static

# Github variables
github.username=DimitryGonzales
github.max-projects=6
