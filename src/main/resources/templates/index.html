<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Portfolio</title>

        <!-- Font Awesome -->
        <link rel="stylesheet" th:href="@{/css/fontawesome.min.css}" />

        <!-- CSS -->
        <link rel="stylesheet" th:href="@{/css/style.css}" />
    </head>
    <body>
        <main>
            <!-- Hero -->
            <section class="hero-wrapper">
                <div class="hero">
                    <a
                        href="https://github.com/DimitryGonzales"
                        class="hero-info"
                        target="_blank"
                    >
                        <img
                            src="https://avatars.githubusercontent.com/u/125162224?v=4"
                            alt="GitHub Avatar"
                            class="hero-avatar"
                        />

                        <div class="hero-title">
                            <h1 class="hero-name">Dimitry Gonzales</h1>

                            <p class="hero-description subtext">
                                Software engineering student.
                            </p>
                        </div>
                    </a>

                    <div class="hero-button-wrapper">
                        <a href="" class="hero-button">Button</a>
                    </div>
                </div>

                <a href="" class="scroll-indicator subtext">
                    <p>Scroll down</p>

                    <i
                        class="fa-solid fa-computer-mouse scroll-indicator-icon-mouse"
                    ></i>

                    <i
                        class="fa-solid fa-hand-pointer scroll-indicator-icon-hand"
                    ></i>
                </a>
            </section>
        </main>
    </body>
</html>
