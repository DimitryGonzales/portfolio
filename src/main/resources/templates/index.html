<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Portfolio</title>

        <!-- Font Awesome -->
        <link rel="stylesheet" th:href="@{/css/fontawesome.min.css}" />

        <!-- CSS -->
        <link rel="stylesheet" th:href="@{/css/style.css}" />

        <!-- Scripts -->
        <script th:src="@{/js/sectionIndicator.js}" defer></script>
        <script th:src="@{/js/theme.js}" defer></script>
    </head>
    <body>
        <!-- Curriculum -->
        <input type="checkbox" id="curriculum-toggle" />

        <section class="curriculum">
            <header class="curriculum-header">
                <h2 class="curriculum-header-title">Curriculum</h2>

                <label for="curriculum-toggle" class="curriculum-header-close">
                    <i class="fa-solid fa-xmark"></i>
                </label>
            </header>

            <embed
                th:src="@{/documents/test.pdf}"
                type="application/pdf"
                class="curriculum-viewer"
            />
        </section>

        <main>
            <!-- Hero -->
            <section class="hero-wrapper" id="hero">
                <div class="hero">
                    <a
                        href="https://github.com/DimitryGonzales"
                        class="hero-info"
                        target="_blank"
                    >
                        <div class="hero-avatar">
                            <img
                                src="https://avatars.githubusercontent.com/u/125162224?v=4"
                                alt="GitHub Avatar"
                            />

                            <i class="fa-brands fa-github"></i>
                        </div>

                        <div class="hero-title">
                            <h1 class="hero-name">
                                Dimitry Gonzales

                                <i
                                    class="fa-solid fa-arrow-up-right-from-square"
                                ></i>
                            </h1>

                            <p class="hero-description subtext">
                                Software engineering student
                            </p>
                        </div>
                    </a>

                    <div class="hero-button-wrapper">
                        <label for="curriculum-toggle" class="hero-button"
                            >Curriculum</label
                        >
                    </div>
                </div>

                <a href="#about-me" class="scroll-indicator subtext">
                    <p>Scroll down</p>

                    <i class="fa-solid fa-computer-mouse"></i>

                    <i class="fa-solid fa-hand-pointer"></i>
                </a>
            </section>

            <!-- Topbar -->
            <header class="topbar">
                <!-- Topbar links -->
                <nav class="topbar-link-wrapper">
                    <ul>
                        <li>
                            <a href="#" class="topbar-link" id="hero-indicator">
                                <i class="fa-solid fa-house"></i>
                            </a>
                        </li>

                        <li>
                            <a
                                href="#about-me"
                                class="topbar-link"
                                id="about-me-indicator"
                                >About me</a
                            >
                        </li>

                        <li>
                            <a
                                href="#projects"
                                class="topbar-link"
                                id="projects-indicator"
                                >Projects</a
                            >
                        </li>

                        <li>
                            <a
                                href="#experiences"
                                class="topbar-link"
                                id="experiences-indicator"
                                >Experiences</a
                            >
                        </li>

                        <li>
                            <a
                                href="#contact-me"
                                class="topbar-link"
                                id="contact-me-indicator"
                                >Contact me</a
                            >
                        </li>
                    </ul>
                </nav>

                <div class="topbar-tools">
                    <!-- Topbar quick access -->
                    <div class="topbar-quick-access-wrapper">
                        <a
                            href="https://github.com/DimitryGonzales"
                            target="_blank"
                            class="topbar-quick-access"
                        >
                            <i class="fa-brands fa-github"></i>
                        </a>

                        <label
                            for="curriculum-toggle"
                            class="topbar-quick-access"
                        >
                            <i class="fa-solid fa-file-lines"></i>
                        </label>
                    </div>

                    <!-- Menu -->
                    <input type="checkbox" id="menu-toggle" />

                    <label for="menu-toggle" class="menu-toggle-label">
                        <i class="fa-solid fa-gear"></i>
                        <i class="fa-solid fa-xmark"></i>
                    </label>

                    <div class="menu">
                        <!-- Theme -->
                        <section class="menu-section">
                            <h3 class="menu-section-title">Theme</h3>

                            <ul class="menu-section-option-wrapper">
                                <li>
                                    <input
                                        type="radio"
                                        name="theme-toggle"
                                        value="auto"
                                        class="menu-section-option-toggle"
                                        id="theme-auto"
                                        checked
                                    />

                                    <label
                                        for="theme-auto"
                                        class="menu-section-option"
                                        >Auto</label
                                    >
                                </li>

                                <li>
                                    <input
                                        type="radio"
                                        name="theme-toggle"
                                        value="light"
                                        class="menu-section-option-toggle"
                                        id="theme-light"
                                    />

                                    <label
                                        for="theme-light"
                                        class="menu-section-option"
                                        >Light</label
                                    >
                                </li>

                                <li>
                                    <input
                                        type="radio"
                                        name="theme-toggle"
                                        value="dark"
                                        class="menu-section-option-toggle"
                                        id="theme-dark"
                                    />

                                    <label
                                        for="theme-dark"
                                        class="menu-section-option"
                                        >Dark</label
                                    >
                                </li>
                            </ul>
                        </section>

                        <!-- Language -->
                        <section class="menu-section">
                            <h3 class="menu-section-title">Language</h3>

                            <ul class="menu-section-option-wrapper">
                                <li>
                                    <input
                                        type="radio"
                                        name="language-toggle"
                                        class="menu-section-option-toggle"
                                        id="language-english"
                                        checked
                                    />

                                    <label
                                        for="language-english"
                                        class="menu-section-option"
                                        >English</label
                                    >
                                </li>

                                <li>
                                    <input
                                        type="radio"
                                        name="language-toggle"
                                        class="menu-section-option-toggle"
                                        id="language-portuguese"
                                    />

                                    <label
                                        for="language-portuguese"
                                        class="menu-section-option"
                                        >Portuguese</label
                                    >
                                </li>
                            </ul>
                        </section>
                    </div>
                </div>
            </header>

            <!-- About me -->
            <section class="grid-section" id="about-me">
                <div class="grid-section-content-wrapper">
                    <h2 class="grid-section-content grid-section-title">
                        About me
                    </h2>
                </div>
            </section>

            <!-- Projects -->
            <section class="grid-section" id="projects">
                <div class="grid-section-content-wrapper">
                    <h2 class="grid-section-content grid-section-title">
                        Projects
                    </h2>
                </div>

                <div class="grid-section-content-wrapper">
                    <div class="grid-section-content project-wrapper">
                        <a href="#projects" class="project">
                            <img
                                src="https://picsum.photos/1920/1080"
                                alt=""
                                class="project-image"
                            />

                            <div class="project-info">
                                <h3 class="project-info-title">
                                    Lorem, ipsum dolor.
                                </h3>
                            </div>
                        </a>
                    </div>
                </div>
            </section>

            <!-- Experiences -->
            <section class="grid-section" id="experiences">
                <div class="grid-section-content-wrapper">
                    <h2 class="grid-section-content grid-section-title">
                        Experiences
                    </h2>
                </div>
            </section>

            <!-- Contact me -->
            <section class="grid-section" id="contact-me">
                <div class="grid-section-content-wrapper">
                    <h2 class="grid-section-content grid-section-title">
                        Contact me
                    </h2>
                </div>
            </section>
        </main>
    </body>
</html>
