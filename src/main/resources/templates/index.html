<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Portfolio</title>

        <!-- Font Awesome -->
        <link rel="stylesheet" th:href="@{/css/fontawesome.min.css}" />

        <!-- CSS -->
        <link rel="stylesheet" th:href="@{/css/style.css}" />

        <!-- Scripts -->
        <script th:src="@{/js/theme.js}" defer></script>
        <script th:src="@{/js/sectionIndicator.js}" defer></script>
        <script th:src="@{/js/contact.js}" defer></script>
    </head>
    <body>
        <!-- Curriculum -->
        <input type="checkbox" id="curriculum-toggle" />

        <section class="curriculum">
            <header class="curriculum-header">
                <h2 class="curriculum-header-title">Curriculum</h2>

                <label for="curriculum-toggle" class="curriculum-header-close">
                    <i class="fa-solid fa-xmark"></i>
                </label>
            </header>

            <embed
                th:src="@{/documents/curriculum.pdf}"
                type="application/pdf"
                class="curriculum-viewer"
            />
        </section>

        <main>
            <!-- Hero -->
            <section class="hero-wrapper" id="hero">
                <div class="hero">
                    <a
                        href="https://github.com/DimitryGonzales"
                        class="hero-info"
                        target="_blank"
                    >
                        <div class="hero-avatar">
                            <img
                                src="https://avatars.githubusercontent.com/u/125162224?v=4"
                                alt="GitHub Avatar"
                            />
                        </div>

                        <div class="hero-title">
                            <h1 class="hero-name">Dimitry Gonzales</h1>

                            <p class="hero-description">
                                Software engineering student
                            </p>
                        </div>
                    </a>

                    <div class="hero-button-wrapper">
                        <label for="curriculum-toggle" class="hero-button"
                            >Curriculum</label
                        >
                    </div>
                </div>

                <a href="#info" class="scroll-indicator">
                    <p>Scroll down</p>

                    <i class="fa-solid fa-computer-mouse"></i>

                    <i class="fa-solid fa-hand-pointer"></i>
                </a>
            </section>

            <!-- Topbar -->
            <header class="topbar">
                <!-- Topbar links -->
                <nav class="topbar-link-wrapper">
                    <ul>
                        <li>
                            <a href="#" class="topbar-link" id="hero-indicator">
                                <i class="fa-solid fa-house"></i>
                            </a>
                        </li>

                        <li>
                            <a
                                href="#info"
                                class="topbar-link"
                                id="info-indicator"
                                >Info</a
                            >
                        </li>

                        <li>
                            <a
                                href="#projects"
                                class="topbar-link"
                                id="projects-indicator"
                                >Projects</a
                            >
                        </li>

                        <li>
                            <a
                                href="#experiences"
                                class="topbar-link"
                                id="experiences-indicator"
                                >Experiences</a
                            >
                        </li>

                        <li>
                            <a
                                href="#contact-me"
                                class="topbar-link"
                                id="contact-me-indicator"
                                >Contact me</a
                            >
                        </li>
                    </ul>
                </nav>

                <div class="topbar-tools">
                    <!-- Topbar quick access -->
                    <div class="topbar-quick-access-wrapper">
                        <a
                            href="https://github.com/DimitryGonzales"
                            target="_blank"
                            class="topbar-quick-access"
                        >
                            <i class="fa-brands fa-github"></i>
                        </a>

                        <label
                            for="curriculum-toggle"
                            class="topbar-quick-access"
                        >
                            <i class="fa-solid fa-file-lines"></i>
                        </label>
                    </div>

                    <!-- Menu -->
                    <input type="checkbox" id="menu-toggle" />

                    <label for="menu-toggle" class="menu-toggle-label">
                        <i class="fa-solid fa-gear"></i>
                        <i class="fa-solid fa-xmark"></i>
                    </label>

                    <div class="menu">
                        <!-- Theme -->
                        <section class="menu-section">
                            <h3 class="menu-section-title">Theme</h3>

                            <ul class="menu-section-option-wrapper">
                                <li>
                                    <input
                                        type="radio"
                                        name="theme-toggle"
                                        value="auto"
                                        class="menu-section-option-toggle"
                                        id="theme-auto"
                                        checked
                                    />

                                    <label
                                        for="theme-auto"
                                        class="menu-section-option"
                                        >Auto</label
                                    >
                                </li>

                                <li>
                                    <input
                                        type="radio"
                                        name="theme-toggle"
                                        value="light"
                                        class="menu-section-option-toggle"
                                        id="theme-light"
                                    />

                                    <label
                                        for="theme-light"
                                        class="menu-section-option"
                                        >Light</label
                                    >
                                </li>

                                <li>
                                    <input
                                        type="radio"
                                        name="theme-toggle"
                                        value="dark"
                                        class="menu-section-option-toggle"
                                        id="theme-dark"
                                    />

                                    <label
                                        for="theme-dark"
                                        class="menu-section-option"
                                        >Dark</label
                                    >
                                </li>
                            </ul>
                        </section>

                        <!-- Language -->
                        <section class="menu-section">
                            <h3 class="menu-section-title">Language</h3>

                            <ul class="menu-section-option-wrapper">
                                <li>
                                    <input
                                        type="radio"
                                        name="language-toggle"
                                        class="menu-section-option-toggle"
                                        id="language-english"
                                        checked
                                    />

                                    <label
                                        for="language-english"
                                        class="menu-section-option"
                                        >English</label
                                    >
                                </li>

                                <li>
                                    <input
                                        type="radio"
                                        name="language-toggle"
                                        class="menu-section-option-toggle"
                                        id="language-portuguese"
                                    />

                                    <label
                                        for="language-portuguese"
                                        class="menu-section-option"
                                        >Portuguese</label
                                    >
                                </li>
                            </ul>
                        </section>
                    </div>
                </div>
            </header>

            <!-- Info -->
            <section class="grid-section" id="info">
                <div class="grid-section-content-wrapper">
                    <h2 class="grid-section-content grid-section-title">
                        Info
                    </h2>
                </div>
            </section>

            <!-- Projects -->
            <section class="grid-section" id="projects">
                <div class="grid-section-content-wrapper">
                    <h2 class="grid-section-content grid-section-title">
                        Projects
                    </h2>
                </div>

                <div class="grid-section-content-wrapper">
                    <div class="grid-section-content project-wrapper">
                        <a
                            th:each="repo : ${repos}"
                            th:href="${repo.htmlUrl}"
                            target="_blank"
                            class="project"
                        >
                            <img
                                th:src="${repo.imageUrl}"
                                th:alt="${repo.name}"
                                loading="lazy"
                                class="project-image"
                            />

                            <div class="project-info">
                                <div class="project-info-data">
                                    <h3
                                        th:text="${repo.name}"
                                        class="project-info-data-title"
                                    ></h3>

                                    <div class="project-info-data-stat-wrapper">
                                        <p class="project-info-data-stat">
                                            <i
                                                class="fa-solid fa-clock-rotate-left"
                                            ></i>

                                            <span
                                                th:text="${repo.timeAgo}"
                                                class="project-info-data-stat-value"
                                            ></span>
                                        </p>

                                        <p class="project-info-data-stat">
                                            <i class="fa-solid fa-code"></i>

                                            <span
                                                th:text="${repo.language} ?: 'No language'"
                                                class="project-info-data-stat-value"
                                            ></span>
                                        </p>

                                        <p class="project-info-data-stat">
                                            <i
                                                class="fa-solid fa-scale-balanced"
                                            ></i>

                                            <span
                                                th:text="${repo.licenseLabel} ?: 'No license'"
                                                class="project-info-data-stat-value"
                                            ></span>
                                        </p>
                                    </div>
                                </div>

                                <p
                                    th:text="${repo.description} ?: 'No description.'"
                                    class="project-info-description"
                                ></p>
                            </div>
                        </a>
                    </div>
                </div>

                <div class="grid-section-content-wrapper">
                    <div
                        class="grid-section-content grid-section-button-wrapper"
                    >
                        <div class="grid-section-button-wrapper">
                            <a
                                href="https://github.com/DimitryGonzales?tab=repositories"
                                target="_blank"
                                class="grid-section-button"
                            >
                                See more
                            </a>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Experiences -->
            <section class="grid-section" id="experiences">
                <div class="grid-section-content-wrapper">
                    <div class="grid-section-content">
                        <div class="grid-section-content-wrapper">
                            <h2 class="grid-section-content grid-section-title">
                                Experiences
                            </h2>
                        </div>
                    </div>
                </div>

                <div class="grid-section-content-wrapper">
                    <div class="grid-section-content">
                        <div class="grid-section-content-wrapper">
                            <ol class="grid-section-content experience-wrapper">
                                <li class="experience">
                                    <p class="experience-period">
                                        2026 - Ongoing
                                    </p>

                                    <div class="experience-info">
                                        <h3 class="experience-title">
                                            PUC Minas
                                        </h3>

                                        <p class="experience-description">
                                            Bachelor’s Degree in Software
                                            Engineering
                                        </p>
                                    </div>
                                </li>
                            </ol>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Contact me -->
            <section class="grid-section" id="contact-me">
                <div class="grid-section-content-wrapper">
                    <div class="grid-section-content">
                        <div class="grid-section-content-wrapper">
                            <h2 class="grid-section-content grid-section-title">
                                Contact me
                            </h2>
                        </div>
                    </div>
                </div>

                <div class="grid-section-content-wrapper">
                    <div class="grid-section-content">
                        <div class="grid-section-content-wrapper">
                            <form
                                class="grid-section-content contact-me"
                                name="contact-me"
                                id="contact-form"
                                method="post"
                                action="/contact"
                            >
                                <h3 class="contact-me-title">Name</h3>

                                <input
                                    type="text"
                                    name="name"
                                    maxlength="100"
                                    class="contact-me-name"
                                    required
                                />

                                <h3 class="contact-me-title">Message</h3>

                                <textarea
                                    name="message"
                                    maxlength="2000"
                                    class="contact-me-message"
                                    required
                                ></textarea>

                                <button class="contact-me-button" type="submit">
                                    Send
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </body>
</html>
